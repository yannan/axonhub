          description: 操作是否成功
        data:
          $ref: "#/components/schemas/ModelPricing"
          description: 计费配置详情
      required: [success]
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 操作是否成功
      required: [success]
