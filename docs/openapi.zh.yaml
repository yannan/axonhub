          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "403":
          description: 禁止访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
  /admin/pricing/{model}:
    delete:
      tags: [管理]
      summary: 按模型删除计费配置
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ModelPath"
      responses:
        "200":
          description: 删除结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: 请求无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "403":
          description: 禁止访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "404":
          description: 未找到计费配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
  /admin/pricing/{model}/disable:
    put:
      tags: [管理]
      summary: 按模型禁用计费配置
      description: 将计费配置标记为禁用（status=disabled）。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ModelPath"
      responses:
        "200":
          description: 禁用结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingToggleResponse"
        "400":
          description: 请求无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "403":
          description: 禁止访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "404":
          description: 未找到计费配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
  /admin/pricing/{model}/enable:
    put:
      tags: [管理]
      summary: 按模型启用计费配置
      description: 将计费配置标记为启用（status=enabled）。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ModelPath"
      responses:
        "200":
          description: 启用结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingToggleResponse"
        "400":
          description: 请求无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "403":
          description: 禁止访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "404":
          description: 未找到计费配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
  /admin/billing/stats:
    get:
      tags: [管理]
      summary: 获取聚合消耗统计
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: query
          required: false
          description: 按项目 ID 过滤
          schema:
            type: integer
        - name: model
          in: query
          required: false
          description: 按模型名称过滤
          schema:
            type: string
        - name: start_date
          in: query
          required: false
          description: 开始日期（RFC3339 或 YYYY-MM-DD）
          schema:
            type: string
        - name: end_date
          in: query
          required: false
          description: 结束日期（RFC3339 或 YYYY-MM-DD）
          schema:
            type: string
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 聚合消耗统计
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumptionStatsResponse"
        "400":
          description: 请求无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "403":
          description: 禁止访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
  /admin/billing/export:
    get:
      tags: [管理]
      summary: 导出聚合消耗统计
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: query
          required: false
          description: 按项目 ID 过滤
          schema:
            type: integer
        - name: model
          in: query
          required: false
          description: 按模型名称过滤
          schema:
            type: string
        - name: start_date
          in: query
          required: false
          description: 开始日期（RFC3339 或 YYYY-MM-DD）
          schema:
            type: string
        - name: end_date
          in: query
          required: false
          description: 结束日期（RFC3339 或 YYYY-MM-DD）
          schema:
            type: string
      responses:
        "200":
          description: CSV 导出
          content:
            application/vnd.ms-excel:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
        "400":
          description: 请求无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "403":
          description: 禁止访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
  /admin/system/settings:
    get:
      tags: [管理]
      summary: 获取系统设置
      description: |
        当前前端使用的设置项：
        - `user_selectable_groups`: 用户新建项目时可选分组，`value` 为 JSON 对象，键为分组代码，值为显示名称。
          例：`{"default":"默认分组","vip":"VIP用户","svip":"SVIP用户"}`
        - `group_ratio`: 分组倍率配置，`value` 为 JSON 对象，键为分组代码，值为倍率（数字）。
          例：`{"default":1,"vip":0.8,"svip":0.5}`
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: query
          required: false
          description: 可选的 setting key，用于获取单个设置（如 `user_selectable_groups` 或 `group_ratio`）
          schema:
            type: string
      responses:
        "200":
          description: 系统设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetSystemSettingsResponse"
        "404":
          description: 未找到设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [管理]
      summary: 更新系统设置
      description: |
        用于更新分组相关配置时：
        - `key=user_selectable_groups`，`value` 为分组代码到显示名称的映射。
          例：`{"key":"user_selectable_groups","value":{"default":"默认分组","vip":"VIP用户"}}`
        - `key=group_ratio`，`value` 为分组代码到倍率（数字）的映射。
          例：`{"key":"group_ratio","value":{"default":1,"vip":0.8}}`
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSystemSettingsRequest"
      responses:
        "200":
          description: 更新结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateSystemSettingsResponse"
        "400":
          description: 请求无效或更新失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateSystemSettingsResponse"
  /project/redemption/redeem:
    parameters:
