                $ref: "#/components/schemas/ErrorMessageResponse"
  /project/dashboard/stats:
    parameters:
      - $ref: "#/components/parameters/ProjectIDHeader"
    get:
      tags: [项目]
      summary: 获取项目仪表盘统计
      security:
