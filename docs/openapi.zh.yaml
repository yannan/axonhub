          schema:
            type: string
        - name: end_date
          in: query
          required: false
          description: 结束日期（RFC3339 或 YYYY-MM-DD）
          schema:
            type: string
      responses:
        "200":
          description: 仪表盘统计
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStatsResponse"
        "400":
          description: 请求无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        API key sent in one of the supported headers (Authorization, X-API-Key, API-Key, etc).
        Authorization supports optional prefixes: Bearer, Token, Api-Key.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProjectIDHeader:
      name: X-Project-ID
      in: header
      required: false
      description: |
        可选的项目上下文，用于 admin/user/project 接口。
        传入项目 GUID（例如 gid://axonhub/Project/1）。
      schema:
        type: string
      example: gid://axonhub/Project/1
    IdPath:
      name: id
      in: path
      required: true
      description: 资源 ID
      schema:
        type: integer
    ModelPath:
      name: model
      in: path
      required: true
      description: 模型名称
      schema:
        type: string
    ModelQuery:
      name: model
      in: query
      required: false
      description: 按模型名称模糊搜索
      schema:
        type: string
    Offset:
      name: offset
      in: query
      required: false
      description: 分页偏移量，从 0 开始
      schema:
        type: integer
        minimum: 0
    Limit:
      name: limit
      in: query
      required: false
      description: 分页数量
      schema:
        type: integer
        minimum: 1
        maximum: 200
    RedemptionCodeQuery:
      name: code
      in: query
      required: false
      description: 按兑换码内容过滤
      schema:
        type: string
    RedemptionStatusQuery:
      name: status
      in: query
      required: false
      description: 按兑换码状态过滤
      schema:
        type: string
        enum: [active, used, disabled]
    RedemptionVoidedQuery:
      name: voided
      in: query
      required: false
      description: 是否已作废
      schema:
        type: boolean
    RedemptionUsedByQuery:
      name: used_by
      in: query
      required: false
      description: 使用者用户 ID
      schema:
        type: integer
    RedemptionExpiredQuery:
      name: expired
      in: query
      required: false
      description: 是否已过期
      schema:
        type: boolean
    RechargeUserIDQuery:
      name: user_id
      in: query
      required: false
      description: 按用户 ID 过滤
      schema:
        type: integer
    RechargeProjectIDQuery:
      name: project_id
      in: query
      required: false
      description: 按项目 ID 过滤
      schema:
        type: integer
    RechargeCodeIDQuery:
      name: code_id
      in: query
      required: false
      description: 按兑换码 ID 过滤
      schema:
        type: integer
    RechargeStatusQuery:
      name: status
      in: query
      required: false
      description: 按充值状态过滤
      schema:
        type: string
        enum: [success, failed]
  schemas:
    GenericObject:
      type: object
      additionalProperties: true
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        timestamp:
          type: string
          format: date-time
        version:
          type: string
        build:
          $ref: "#/components/schemas/BuildInfo"
        uptime:
          type: string
      required: [status]
    BuildInfo:
      type: object
      properties:
        version:
          type: string
        commit:
          type: string
        build_time:
          type: string
        go_version:
          type: string
        platform:
          type: string
        uptime:
          type: string
      required: [version, go_version, platform, uptime]
    SystemStatusResponse:
      type: object
      properties:
        isInitialized:
          type: boolean
          description: 是否已完成系统初始化
      required: [isInitialized]
    InitializeSystemRequest:
      type: object
      properties:
        ownerEmail:
          type: string
          format: email
          description: 系统管理员邮箱
        ownerPassword:
          type: string
          minLength: 6
          description: 系统管理员密码
        ownerFirstName:
          type: string
          description: 管理员名
        ownerLastName:
          type: string
          description: 管理员姓
        brandName:
          type: string
          description: 平台展示名称
      required: [ownerEmail, ownerPassword, ownerFirstName, ownerLastName, brandName]
      additionalProperties: false
    InitializeSystemResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 初始化是否成功
        message:
          type: string
          description: 初始化结果提示
      required: [success, message]
    GetSystemSettingsResponse:
      type: object
      properties:
        settings:
          type: array
          description: 系统设置列表
          items:
            $ref: "#/components/schemas/SettingItem"
      required: [settings]
    SettingItem:
      type: object
      properties:
        key:
          type: string
          description: 设置项键名
        value:
          type: object
          additionalProperties: true
          description: 设置项内容（JSON）
        description:
          type: string
          description: 设置项说明
        updated_at:
          type: string
          description: 最后更新时间
      required: [key, value, description, updated_at]
    UpdateSystemSettingsRequest:
      type: object
      properties:
        key:
          type: string
          description: 设置项键名
        value:
          type: object
          additionalProperties: true
          description: 设置项内容（JSON）
        description:
          type: string
          description: 设置项说明（可选）
      required: [key, value]
      additionalProperties: false
    UpdateSystemSettingsResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 更新是否成功
        message:
          type: string
          description: 更新结果提示
        setting:
          $ref: "#/components/schemas/SettingItem"
          description: 更新后的设置项
      required: [success, message]
    ErrorResponse:
      type: object
      description: 结构化错误对象（主要用于系统设置相关接口）
      properties:
        error:
          $ref: "#/components/schemas/ErrorObject"
      required: [error]
    ErrorObject:
      type: object
      properties:
        type:
          type: string
        message:
          type: string
      required: [type, message]
    ErrorMessageResponse:
      type: object
      description: 简单字符串错误对象（多数接口使用）
      properties:
        error:
          type: string
      required: [error]
    SignInRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: 登录邮箱
        password:
          type: string
          description: 登录密码
      required: [email, password]
      additionalProperties: false
    SignInResponse:
      type: object
      properties:
        token:
          type: string
          description: 登录后的访问令牌
        user:
          $ref: "#/components/schemas/UserInfo"
          description: 当前登录用户信息
      required: [token, user]
    GUID:
      type: object
      properties:
        type:
          type: string
          description: 资源类型
        id:
          type: integer
          description: 资源数值 ID
      required: [type, id]
    UserInfo:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/GUID"
          description: 用户 ID
        email:
          type: string
          description: 邮箱
        firstName:
          type: string
          description: 名
        lastName:
          type: string
          description: 姓
        isOwner:
          type: boolean
          description: 是否为系统所有者
        preferLanguage:
          type: string
          description: 语言偏好
        avatar:
          type: string
          nullable: true
          description: 头像 URL
        scopes:
          type: array
          description: 用户全局权限列表
          items:
            type: string
        roles:
          type: array
          description: 用户角色列表
          items:
            $ref: "#/components/schemas/RoleInfo"
        projects:
          type: array
          description: 用户所属项目列表
          items:
            $ref: "#/components/schemas/UserProjectInfo"
      required: [id, email, firstName, lastName, isOwner, preferLanguage, scopes, roles, projects]
    RoleInfo:
      type: object
      properties:
        name:
          type: string
          description: 角色名称
      required: [name]
    UserProjectInfo:
      type: object
      properties:
        projectID:
          $ref: "#/components/schemas/GUID"
          description: 项目 ID
        isOwner:
          type: boolean
          description: 是否为项目所有者
        scopes:
          type: array
          description: 项目内权限列表
          items:
            type: string
        roles:
          type: array
          description: 项目内角色列表
          items:
            $ref: "#/components/schemas/RoleInfo"
      required: [projectID, isOwner, scopes, roles]
    GraphQLRequest:
      type: object
      properties:
        query:
          type: string
        variables:
          type: object
          additionalProperties: true
        operationName:
          type: string
      required: [query]
    DeleteCodesRequest:
      type: object
      properties:
        ids:
          type: array
          description: 要删除的兑换码 ID 列表
          items:
            type: integer
      required: [ids]
    RedemptionGenerateRequest:
      type: object
      properties:
        count:
          type: integer
          minimum: 1
          description: 生成数量
        quota:
          type: integer
          minimum: 1
          description: 单个兑换码额度
        max_uses:
          type: integer
          minimum: 1
          nullable: true
          description: 单码最大可使用次数
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: 过期时间
        export:
          type: boolean
          description: 是否导出为文件，true 时返回 CSV 文件，false 时返回 JSON
      required: [count, quota]
      additionalProperties: false
    RedemptionGenerateResponse:
      type: object
      properties:
        data:
          type: array
          description: 生成的兑换码列表
          items:
            type: string
      required: [data]
    RedeemRequest:
      type: object
      properties:
        code:
          type: string
          description: 兑换码
      required: [code]
      additionalProperties: false
    RedeemResponse:
      type: object
      properties:
        status:
          type: string
          description: 兑换结果状态
        quota:
          type: integer
          description: 成功兑换的额度
      required: [status, quota]
    RedemptionListResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 查询是否成功
        data:
          type: array
          description: 兑换码列表
          items:
            $ref: "#/components/schemas/RedemptionCode"
        pagination:
          $ref: "#/components/schemas/RedemptionPagination"
          description: 分页信息
      required: [success, data, pagination]
    RedemptionPagination:
      type: object
      properties:
        total:
          type: integer
          description: 总记录数
        offset:
          type: integer
          description: 当前分页偏移量
        limit:
          type: integer
          description: 当前分页数量
      required: [total, offset, limit]
    RedemptionCode:
      type: object
      properties:
        id:
          type: integer
          description: 兑换码 ID
        code:
          type: string
          description: 兑换码字符串
        quota:
          type: integer
          description: 兑换额度
        status:
          type: string
          enum: [active, used, disabled]
          description: 兑换码状态
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: 过期时间
        max_uses:
          type: integer
          description: 最大可使用次数
        used_times:
          type: integer
          description: 已使用次数
        voided:
          type: boolean
          description: 是否已作废
        used_by:
          type: integer
          nullable: true
          description: 使用者用户 ID
        used_at:
          type: string
          format: date-time
          nullable: true
          description: 使用时间
        created_at:
          type: string
          format: date-time
          description: 创建时间
        updated_at:
          type: string
          format: date-time
          description: 更新时间
        deleted_at:
          type: integer
          description: 软删除时间戳
      required: [id, code, quota, status, max_uses, used_times, voided, created_at, updated_at, deleted_at]
    RechargeListResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 查询是否成功
        data:
          type: array
          description: 充值记录列表
          items:
            $ref: "#/components/schemas/RechargeRecord"
        pagination:
          $ref: "#/components/schemas/RechargePagination"
          description: 分页信息
      required: [success, data, pagination]
    RechargePagination:
      type: object
      properties:
        total:
          type: integer
          description: 总记录数
        offset:
          type: integer
          description: 当前分页偏移量
        limit:
          type: integer
          description: 当前分页数量
      required: [total, offset, limit]
    RechargeRecord:
      type: object
      properties:
        id:
          type: integer
          description: 充值记录 ID
        user_id:
          type: integer
          description: 用户 ID
        project_id:
          type: integer
          description: 项目 ID
        code_id:
          type: integer
          description: 兑换码 ID
        amount:
          type: integer
          format: int64
          description: 充值额度
        status:
          type: string
          enum: [success, failed]
          description: 充值状态
        trace_id:
          type: string
          nullable: true
          description: 请求追踪 ID
        created_at:
          type: string
          format: date-time
          description: 创建时间
        updated_at:
          type: string
          format: date-time
          description: 更新时间
      required: [id, user_id, project_id, code_id, amount, status, created_at, updated_at]
    SubscriptionResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 查询是否成功
        data:
          $ref: "#/components/schemas/SubscriptionData"
          description: 订阅额度信息
      required: [success, data]
    SubscriptionData:
      type: object
      properties:
        quota:
          type: integer
          format: int64
          description: 总额度
        used_quota:
          type: integer
          format: int64
          description: 已使用额度
      required: [quota, used_quota]
    UsageResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 查询是否成功
        data:
          type: array
          description: 用量记录列表
          items:
            $ref: "#/components/schemas/ConsumptionRecord"
        pagination:
          $ref: "#/components/schemas/UsagePagination"
          description: 分页信息
      required: [success, data, pagination]
    UsagePagination:
      type: object
      properties:
        total:
          type: integer
          description: 总记录数
        offset:
          type: integer
          description: 当前分页偏移量
        limit:
          type: integer
          description: 当前分页数量
      required: [total, offset, limit]
    DashboardStatsResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 查询是否成功
        data:
          $ref: "#/components/schemas/DashboardStatsData"
          description: 仪表盘统计数据
      required: [success, data]
    DashboardStatsData:
      type: object
      properties:
        total_requests:
          type: integer
          description: 请求总数
        completed_requests:
          type: integer
          description: 成功完成的请求数
        failed_requests:
          type: integer
          description: 失败请求数
        canceled_requests:
          type: integer
          description: 被取消的请求数
        blocked_requests:
          type: integer
          description: 被拦截/拒绝的请求数
        average_latency_ms:
          type: integer
          format: int64
          nullable: true
          description: 平均响应耗时（毫秒）
        average_first_token_latency_ms:
          type: integer
          format: int64
          nullable: true
          description: 平均首 token 耗时（毫秒）
        prompt_tokens:
          type: integer
          format: int64
          description: Prompt token 总数
        completion_tokens:
          type: integer
          format: int64
          description: Completion token 总数
        total_tokens:
          type: integer
          format: int64
          description: Token 总数
      required:
        [
          total_requests,
          completed_requests,
          failed_requests,
          canceled_requests,
          blocked_requests,
          prompt_tokens,
          completion_tokens,
          total_tokens,
        ]
    ConsumptionStatsResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 查询是否成功
        data:
          type: array
          description: 按天聚合的消耗统计
          items:
            $ref: "#/components/schemas/ConsumptionStatsRow"
        pagination:
          $ref: "#/components/schemas/ConsumptionStatsPagination"
          description: 分页信息
      required: [success, data, pagination]
    ConsumptionStatsPagination:
      type: object
      properties:
        total:
          type: integer
          description: 总记录数
        offset:
          type: integer
          description: 当前分页偏移量
        limit:
          type: integer
          description: 当前分页数量
      required: [total, offset, limit]
    ConsumptionStatsRow:
      type: object
      properties:
        project_id:
          type: integer
          description: 项目 ID
        model:
          type: string
          description: 模型名称
        date:
          type: string
          format: date
          description: 统计日期（YYYY-MM-DD）
        count:
          type: integer
          description: 请求次数
        quota:
          type: integer
          format: int64
          description: 消耗额度
        prompt_tokens:
          type: integer
          format: int64
          description: Prompt token 数
        completion_tokens:
          type: integer
          format: int64
          description: Completion token 数
        total_tokens:
          type: integer
          format: int64
          description: Token 总数
      required:
        [project_id, model, date, count, quota, prompt_tokens, completion_tokens, total_tokens]
    ConsumptionRecord:
      type: object
      properties:
        id:
          type: integer
          description: 用量记录 ID
        user_id:
          type: integer
          description: 用户 ID
        project_id:
          type: integer
          description: 项目 ID
        model:
          type: string
          description: 使用的模型名称
        quota:
          type: integer
          description: 消耗额度
        billing_type:
          type: string
          enum: [quota, connection]
          nullable: true
          description: 计费类型：quota 表示按 token 计费，connection 表示固定额度计费（不随 token 变化）
        trace_id:
          type: string
          nullable: true
          description: 请求追踪 ID
        api_key_id:
          type: integer
          nullable: true
          description: API Key ID
        api_key_name:
          type: string
          nullable: true
          description: API Key 名称
        prompt_tokens:
          type: integer
          description: Prompt token 数
        completion_tokens:
          type: integer
          description: Completion token 数
        total_tokens:
          type: integer
          description: Token 总数
        type:
          type: string
          enum: [chat, image]
          description: 请求类型
        created_at:
          type: string
          format: date-time
          description: 创建时间
        updated_at:
          type: string
          format: date-time
          description: 更新时间
      required:
        [id, user_id, project_id, model, quota, prompt_tokens, completion_tokens, total_tokens, type, created_at, updated_at]
    ChatCompletionRequest:
      type: object
      properties:
        model:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        stream:
          type: boolean
        temperature:
          type: number
        top_p:
          type: number
        max_tokens:
          type: integer
        n:
          type: integer
        stop:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        presence_penalty:
          type: number
        frequency_penalty:
          type: number
        user:
          type: string
      required: [model, messages]
      additionalProperties: true
    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          oneOf:
            - type: string
            - type: array
              items:
                $ref: "#/components/schemas/ChatMessageContentPart"
        name:
          type: string
        tool_call_id:
          type: string
        tool_calls:
          type: array
          items:
            $ref: "#/components/schemas/ToolCall"
      required: [role, content]
      additionalProperties: true
    ChatMessageContentPart:
      type: object
      properties:
        type:
          type: string
          enum: [text, image_url]
        text:
          type: string
        image_url:
          $ref: "#/components/schemas/ImageURL"
      required: [type]
      additionalProperties: true
    ImageURL:
      type: object
      properties:
        url:
          type: string
        detail:
          type: string
          enum: [low, high, auto]
      required: [url]
    ToolCall:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        function:
          $ref: "#/components/schemas/ToolFunction"
      required: [id, type]
      additionalProperties: true
    ToolFunction:
      type: object
      properties:
        name:
          type: string
        arguments:
          type: string
      required: [name, arguments]
    ChatCompletionResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            $ref: "#/components/schemas/ChatCompletionChoice"
        usage:
          $ref: "#/components/schemas/Usage"
      required: [id, object, created, model, choices]
    ChatCompletionChoice:
      type: object
      properties:
        index:
          type: integer
        message:
          $ref: "#/components/schemas/ChatMessage"
        finish_reason:
          type: string
        logprobs:
          type: object
          nullable: true
      required: [index, message]
    Usage:
      type: object
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
      required: [prompt_tokens, total_tokens]
    ResponsesRequest:
      type: object
      properties:
        model:
          type: string
        input:
          oneOf:
            - type: string
            - type: array
              items:
                $ref: "#/components/schemas/ResponseInputItem"
        stream:
          type: boolean
        temperature:
          type: number
        top_p:
          type: number
        max_output_tokens:
          type: integer
        user:
          type: string
      required: [model, input]
      additionalProperties: true
    ResponseInputItem:
      type: object
      properties:
        role:
