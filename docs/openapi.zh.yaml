          type: string
          description: 查询文本
        documents:
          oneOf:
            - type: array
              items:
                type: string
            - type: array
              items:
                type: object
                additionalProperties: true
          description: 待重排序的文档列表
        top_n:
          type: integer
          description: 返回前 N 条结果
        return_documents:
          type: boolean
          description: 是否在结果中返回原始文档
      required: [model, query, documents]
      additionalProperties: true
    RerankResponse:
      type: object
      properties:
        object:
          type: string
