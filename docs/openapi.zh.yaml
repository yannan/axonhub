openapi: 3.0.3
info:
  title: AxonHub API（中文）
  version: 0.1.0
  description: |
    由当前服务路由自动生成。本规范更强调路径覆盖的完整性，而非严格的请求/响应结构校验。
servers:
  - url: http://localhost:8090
    description: 本地开发
tags:
  - name: 系统
  - name: 认证
  - name: 管理
  - name: 用户
  - name: 项目
paths:
  /admin/redemption/generate:
    post:
      tags: [管理]
      summary: 生成兑换码
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedemptionGenerateRequest"
      responses:
        "200":
          description: 已生成的兑换码
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedemptionGenerateResponse"
            application/vnd.ms-excel:
              schema:
                type: string
                format: binary
        "400":
          description: 请求无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "403":
          description: 禁止访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
  /admin/redemption:
    get:
      tags: [管理]
      summary: 列出兑换码
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RedemptionCodeQuery"
        - $ref: "#/components/parameters/RedemptionStatusQuery"
        - $ref: "#/components/parameters/RedemptionVoidedQuery"
        - $ref: "#/components/parameters/RedemptionUsedByQuery"
        - $ref: "#/components/parameters/RedemptionExpiredQuery"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 兑换码
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedemptionListResponse"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "403":
          description: 禁止访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
  /admin/redemption/delete:
    post:
      tags: [管理]
      summary: 删除兑换码
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteCodesRequest"
      responses:
        "200":
          description: 删除结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: 请求无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "403":
          description: 禁止访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
  /admin/redemption/{id}/void:
    post:
      tags: [管理]
      summary: 作废兑换码
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: 作废结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: 无效 ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "403":
          description: 禁止访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "404":
          description: 未找到
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
  /admin/recharges:
    get:
      tags: [管理]
      summary: 充值记录（管理员）
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RechargeUserIDQuery"
        - $ref: "#/components/parameters/RechargeProjectIDQuery"
        - $ref: "#/components/parameters/RechargeCodeIDQuery"
        - $ref: "#/components/parameters/RechargeStatusQuery"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 充值记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechargeListResponse"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "403":
          description: 禁止访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
  /admin/pricing:
    get:
      tags: [管理]
      summary: 获取计费配置
      description: 返回所有计费配置，包括已禁用的记录。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ModelQuery"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 计费配置列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingListResponse"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "403":
          description: 禁止访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
    post:
      tags: [管理]
      summary: 创建计费配置
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingUpsertRequest"
      responses:
        "200":
          description: 已创建计费配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingUpsertResponse"
        "400":
          description: 请求无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "403":
          description: 禁止访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
    put:
      tags: [管理]
      summary: 更新计费配置
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingUpsertRequest"
      responses:
        "200":
          description: 已更新计费配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingUpsertResponse"
        "400":
          description: 请求无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "403":
          description: 禁止访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "404":
          description: 未找到计费配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageResponse"
  /admin/pricing/batch:
    post:
      tags: [管理]
      summary: 批量创建计费配置
      security:
        - bearerAuth: []
      requestBody:
