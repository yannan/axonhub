      required: [object, data, model]
    EmbeddingObject:
      type: object
      properties:
        object:
          type: string
        index:
          type: integer
        embedding:
          type: array
          items:
            type: number
      required: [object, index, embedding]
    EmbeddingUsage:
      type: object
      properties:
        prompt_tokens:
          type: integer
        total_tokens:
          type: integer
      required: [prompt_tokens, total_tokens]
    OpenAIModelsResponse:
      type: object
      properties:
        object:
          type: string
          enum: [list]
