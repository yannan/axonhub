        data:
          type: array
          description: 重排序结果列表
          items:
            $ref: "#/components/schemas/RerankResult"
      required: [data]
    RerankResult:
      type: object
      properties:
        index:
          type: integer
          description: 原始文档索引
        relevance_score:
          type: number
          description: 相关性得分
        document:
          type: object
          additionalProperties: true
          description: 原始文档内容（可选）
      required: [index, relevance_score]
    JsonSchema:
      type: object
      properties:
        type:
          type: string
        properties:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonSchema"
        required:
          type: array
          items:
            type: string
        description:
          type: string
        enum:
          type: array
          items:
            type: string
        items:
          $ref: "#/components/schemas/JsonSchema"
      additionalProperties: true
    AddWordRequest:
      type: object
      properties:
        word:
          type: string
          description: 敏感词内容
        type:
          type: string
          enum: [block, replace]
          description: 处理方式（屏蔽或替换）
      required: [word]
      additionalProperties: false
    SensitiveWordResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/SensitiveWord"
