      required: [total, offset, limit]
    ModelPricing:
      type: object
      properties:
        id:
          type: integer
          description: 计费配置 ID
        model:
          type: string
          description: 模型名称
        type:
          type: string
          enum: [quota, connection]
          description: 计费类型：quota 表示按 token 计费，connection 表示固定额度计费（不随 token 变化）
        status:
          type: string
          enum: [enabled, disabled]
          description: 计费配置状态
        quota:
          type: number
          description: 模型倍率，仅在 type=quota 时生效；实际消耗约为 ceil((prompt_tokens + completion_tokens * completion_ratio) * quota * group_multiplier)
        completion_ratio:
          type: number
          description: 补全倍率，仅在 type=quota 时生效；completion_tokens 会乘以该倍率（未设置时视为 1）
        price:
          type: number
          description: 固定额度，仅在 type=connection 时生效；实际消耗约为 ceil(price * group_multiplier)
        created_at:
          type: string
          format: date-time
          description: 创建时间
        updated_at:
          type: string
          format: date-time
          description: 更新时间
      required: [id, model, type, status, quota, completion_ratio, price, created_at, updated_at]
