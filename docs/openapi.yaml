components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        API key sent in one of the supported headers (Authorization, X-API-Key, API-Key, etc).
        Authorization supports optional prefixes: Bearer, Token, Api-Key.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
    ModelPath:
      name: model
      in: path
      required: true
      schema:
        type: string
    ModelQuery:
      name: model
      in: query
      required: false
      description: Filter by model name (fuzzy match)
      schema:
        type: string
    GeminiVersionPath:
      name: gemini-api-version
      in: path
      required: true
      schema:
        type: string
      example: v1beta
    GeminiModelPath:
      name: model
      in: path
      required: true
      schema:
        type: string
      example: gemini-1.5-pro
    GeminiAltQuery:
      name: alt
      in: query
      required: false
      schema:
        type: string
        enum: [sse]
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
    RedemptionCodeQuery:
      name: code
      in: query
      required: false
      schema:
        type: string
    RedemptionStatusQuery:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [active, used, disabled]
    RedemptionVoidedQuery:
      name: voided
      in: query
      required: false
      schema:
        type: boolean
    RedemptionUsedByQuery:
      name: used_by
      in: query
      required: false
      schema:
        type: integer
    RedemptionExpiredQuery:
      name: expired
      in: query
      required: false
      schema:
        type: boolean
    RechargeUserIDQuery:
      name: user_id
      in: query
      required: false
      schema:
        type: integer
    RechargeProjectIDQuery:
      name: project_id
      in: query
      required: false
      schema:
        type: integer
    RechargeCodeIDQuery:
      name: code_id
      in: query
      required: false
      schema:
        type: integer
    RechargeStatusQuery:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [success, failed]
  schemas:
    GenericObject:
      type: object
      additionalProperties: true
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        timestamp:
          type: string
          format: date-time
        version:
          type: string
        build:
          $ref: "#/components/schemas/BuildInfo"
        uptime:
          type: string
      required: [status]
    BuildInfo:
      type: object
      properties:
        version:
          type: string
        commit:
          type: string
        build_time:
          type: string
        go_version:
          type: string
        platform:
          type: string
        uptime:
          type: string
      required: [version, go_version, platform, uptime]
    SystemStatusResponse:
      type: object
      properties:
        isInitialized:
          type: boolean
      required: [isInitialized]
    InitializeSystemRequest:
      type: object
      properties:
        ownerEmail:
          type: string
          format: email
        ownerPassword:
          type: string
          minLength: 6
        ownerFirstName:
          type: string
        ownerLastName:
          type: string
        brandName:
          type: string
      required: [ownerEmail, ownerPassword, ownerFirstName, ownerLastName, brandName]
      additionalProperties: false
    InitializeSystemResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success, message]
    GetSystemSettingsResponse:
      type: object
      properties:
        settings:
          type: array
          items:
            $ref: "#/components/schemas/SettingItem"
      required: [settings]
    SettingItem:
      type: object
      properties:
        key:
          type: string
        value:
          type: object
          additionalProperties: true
        description:
          type: string
        updated_at:
          type: string
      required: [key, value, description, updated_at]
    UpdateSystemSettingsRequest:
      type: object
      properties:
        key:
          type: string
        value:
          type: object
          additionalProperties: true
        description:
          type: string
      required: [key, value]
      additionalProperties: false
    UpdateSystemSettingsResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        setting:
          $ref: "#/components/schemas/SettingItem"
      required: [success, message]
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/ErrorObject"
      required: [error]
    ErrorObject:
      type: object
      properties:
        type:
          type: string
        message:
          type: string
      required: [type, message]
    ErrorMessageResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    SignInRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]
      additionalProperties: false
    SignInResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserInfo"
      required: [token, user]
    GUID:
      type: object
      properties:
        type:
          type: string
        id:
          type: integer
      required: [type, id]
    UserInfo:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/GUID"
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        isOwner:
          type: boolean
        preferLanguage:
          type: string
        avatar:
          type: string
          nullable: true
        scopes:
          type: array
          items:
            type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleInfo"
        projects:
          type: array
          items:
            $ref: "#/components/schemas/UserProjectInfo"
      required: [id, email, firstName, lastName, isOwner, preferLanguage, scopes, roles, projects]
    RoleInfo:
      type: object
      properties:
        name:
          type: string
      required: [name]
    UserProjectInfo:
      type: object
      properties:
        projectID:
          $ref: "#/components/schemas/GUID"
        isOwner:
          type: boolean
        scopes:
          type: array
          items:
            type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleInfo"
      required: [projectID, isOwner, scopes, roles]
    GraphQLRequest:
      type: object
      properties:
        query:
          type: string
        variables:
          type: object
          additionalProperties: true
        operationName:
          type: string
      required: [query]
    DeleteCodesRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
      required: [ids]
    RedemptionGenerateRequest:
      type: object
      properties:
        count:
          type: integer
          minimum: 1
        quota:
          type: integer
          minimum: 1
        max_uses:
          type: integer
          minimum: 1
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        export:
          type: boolean
      required: [count, quota]
      additionalProperties: false
    RedemptionGenerateResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: string
      required: [data]
    RedeemRequest:
      type: object
      properties:
        code:
          type: string
      required: [code]
      additionalProperties: false
    RedeemResponse:
      type: object
      properties:
        status:
          type: string
        quota:
          type: integer
      required: [status, quota]
    RedemptionListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/RedemptionCode"
      required: [success, data]
    RedemptionCode:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        quota:
          type: integer
        status:
          type: string
          enum: [active, used, disabled]
        expires_at:
          type: string
          format: date-time
          nullable: true
        max_uses:
          type: integer
        used_times:
          type: integer
        voided:
          type: boolean
        used_by:
          type: integer
          nullable: true
        used_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: integer
      required: [id, code, quota, status, max_uses, used_times, voided, created_at, updated_at, deleted_at]
    RechargeListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/RechargeRecord"
      required: [success, data]
    RechargeRecord:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        project_id:
          type: integer
        code_id:
          type: integer
        amount:
          type: integer
          format: int64
        status:
          type: string
          enum: [success, failed]
        trace_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, user_id, project_id, code_id, amount, status, created_at, updated_at]
    SubscriptionResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/SubscriptionData"
      required: [success, data]
    SubscriptionData:
      type: object
      properties:
        quota:
          type: integer
          format: int64
        used_quota:
          type: integer
          format: int64
      required: [quota, used_quota]
    UsageResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/ConsumptionRecord"
      required: [success, data]
    DashboardStatsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/DashboardStatsData"
      required: [success, data]
    DashboardStatsData:
      type: object
