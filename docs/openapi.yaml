openapi: 3.0.3
info:
  title: AxonHub API
  version: 0.1.0
  description: |
    Generated from current server routes. This spec favors completeness of paths over strict request/response schemas.
servers:
  - url: http://localhost:8090
    description: Local development
tags:
  - name: System
  - name: Auth
  - name: Admin
  - name: User
  - name: Project
  - name: OpenAI
  - name: Jina
  - name: Anthropic
  - name: Gemini
paths:
  /favicon:
    get:
      tags: [System]
      summary: Get favicon
      responses:
        "200":
          description: Favicon image
          content:
            image/*:
              schema:
                type: string
                format: binary
  /health:
    get:
      tags: [System]
      summary: Health check
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /admin/system/status:
    get:
      tags: [System, Admin]
      summary: Get system status
      responses:
        "200":
          description: System status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatusResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/system/initialize:
    post:
      tags: [System, Admin]
      summary: Initialize system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitializeSystemRequest"
      responses:
        "200":
          description: Initialization result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitializeSystemResponse"
        "400":
          description: Invalid request or already initialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitializeSystemResponse"
        "500":
          description: Initialization failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitializeSystemResponse"
  /admin/auth/signin:
    post:
      tags: [Auth]
      summary: Admin sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: Signed-in session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/playground:
    get:
      tags: [Admin]
      summary: GraphQL playground (HTML)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: HTML playground
          content:
            text/html:
              schema:
